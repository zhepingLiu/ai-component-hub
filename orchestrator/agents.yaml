agents:
  doc-ocr:
    handler: doc_ocr
    gateway_action: doc-ocr
    enable_register: true
    base_url: http://agent-platform:7002
    callback_url: ""
    conversation_url: ""
    upload_url: ""
    run_url: ""
    # API Key is used by conversation and conversation/runs.
    api_key: "your_api_key"
    # AK/SK service signature is used by conversation/file/upload.
    access_key: "your_access_key"
    secret_key: "your_secret_key"
    x_authorization: ""
    query:
      app_id: "your_app_id"
      department_id: "your_department_id"
    # These headers are only used by callbacks/gateway forwarding.
    # They are not automatically sent to the AB agent API calls above.
    headers:
      channel: "your_channel"
    mock_enabled: true
    mock_result_file: "app/agents/doc_ocr/mock_result.json"
    use_real: true

  # Generic agent template for future services.
  # Copy this block, uncomment it, and replace the action/name and credentials.
  # some-agent:
  #   handler: generic_agent
  #   gateway_action: some-agent
  #   enable_register: true
  #   base_url: http://agent-platform:7002
  #   callback_url: http://callback-host/callback
  #   conversation_url: ""
  #   upload_url: ""
  #   run_url: ""
  #   api_key: "your_api_key"
  #   access_key: "your_access_key"
  #   secret_key: "your_secret_key"
  #   x_authorization: ""
  #   query:
  #     app_id: "your_app_id"
  #     department_id: "your_department_id"
  #   headers:
  #     channel: "your_channel"
  #   use_real: true

